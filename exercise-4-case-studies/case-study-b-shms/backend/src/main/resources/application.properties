spring.application.name=shms
server.port=8080

# H2 database stored in the data folder next to the backend (use MySQL by changing these 4 lines)
spring.datasource.url=jdbc:h2:file:./data/shms
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# send the reason of an error back to the React app
server.error.include-message=always
