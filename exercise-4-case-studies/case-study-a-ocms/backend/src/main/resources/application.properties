spring.application.name=ocms
server.port=8080

# H2 database stored in the data folder next to the backend (use MySQL by changing these 4 lines)
spring.datasource.url=jdbc:h2:file:./data/ocms
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# send the reason of an error back to the React app
server.error.include-message=always

# JWT used for login (change the secret for a real deployment)
ocms.jwt.secret=ocms-secret-key-change-me-0123456789-abcdefghij
ocms.jwt.expiration-hours=24

# reminders to students with pending coursework: every day at 9:00
ocms.reminder.cron=0 0 9 * * *
